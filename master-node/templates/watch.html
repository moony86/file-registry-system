<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSYS Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen overflow-x-hidden">
    <div id="ambient-bg" class="fixed inset-0 bg-black bg-center bg-cover opacity-30 blur-2xl scale-110"></div>
    <div class="fixed inset-0 bg-black/75"></div>

    <main class="relative z-10 min-h-screen flex flex-col">
        <header class="px-4 md:px-8 py-4 flex items-center justify-between gap-3">
            <a href="/" class="text-sm text-cyan-200 hover:text-white">Back to Library</a>
            <a href="/dashboard" class="text-xs text-gray-500 hover:text-gray-300">Dashboard</a>
        </header>

        <section class="flex-1 w-full max-w-6xl mx-auto px-4 md:px-8 pb-8 flex flex-col justify-center gap-5">
            <div>
                <p id="watch-kicker" class="text-sm text-cyan-300 font-semibold"></p>
                <h1 id="watch-title" class="text-2xl md:text-4xl font-bold tracking-normal">Loading...</h1>
                <p id="watch-meta" class="mt-2 text-sm text-gray-400"></p>
            </div>

            <div class="bg-black border border-gray-900 shadow-2xl">
                <video id="watch-player" class="w-full max-h-[72vh] bg-black" controls autoplay playsinline></video>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-2">
                    <button id="previous-btn" class="hidden px-3 py-2 bg-gray-900 border border-gray-800 text-gray-200 hover:border-cyan-700 text-sm">Previous Episode</button>
                    <button id="next-btn" class="hidden px-3 py-2 bg-cyan-700 text-white hover:bg-cyan-600 text-sm">Next Episode</button>
                </div>
                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-400">
                    <label>Speed
                        <select id="speed-select" class="ml-2 bg-gray-950 border border-gray-800 text-gray-100 px-2 py-1">
                            <option value="0.5">0.5x</option>
                            <option value="1">1x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </label>
                    <label>Subtitles
                        <select id="subtitle-select" class="ml-2 bg-gray-950 border border-gray-800 text-gray-100 px-2 py-1">
                            <option value="off">Off</option>
                        </select>
                    </label>
                </div>
            </div>

            <div id="next-prompt" class="hidden fixed right-4 bottom-4 z-20 bg-gray-950/95 border border-cyan-900 p-4 shadow-xl max-w-xs">
                <div class="text-sm font-semibold text-gray-100">Next Episode</div>
                <div id="next-prompt-title" class="text-xs text-gray-400 mt-1"></div>
                <button id="next-prompt-btn" class="mt-3 w-full bg-cyan-700 hover:bg-cyan-600 text-white px-3 py-2 text-sm">Play Next</button>
            </div>

            <div id="watch-error" class="hidden text-red-300 border border-red-900 bg-red-950/30 p-4"></div>
        </section>
    </main>

    <script>
        window.FSYS_WATCH_FILE_ID = "{{ file_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/watch.js') }}?v=0.7.3"></script>
</body>
</html>
